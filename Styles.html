<style>
  /* Import Google Fonts */
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap');

  :root {
    --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  /* Base Reset & Smooth Typography */
  html {
    font-family: var(--font-sans);
    scroll-behavior: smooth;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  body {
    font-family: var(--font-sans);
  }

  /* Custom Smooth Scrollbar */
  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }

  ::-webkit-scrollbar-track {
    background: rgba(15, 23, 42, 0.3);
  }

  html:not(.dark) ::-webkit-scrollbar-track {
    background: rgba(241, 245, 249, 0.8);
  }

  ::-webkit-scrollbar-thumb {
    background: rgba(99, 102, 241, 0.35);
    border-radius: 9999px;
    transition: background 0.2s ease;
  }

  ::-webkit-scrollbar-thumb:hover {
    background: rgba(99, 102, 241, 0.65);
  }

  /* Design System Utility Classes - Glassmorphism 2.0 */
  .glass-card {
    background: rgba(15, 23, 42, 0.75);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.4), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
  }

  .glass-sidebar {
    background: rgba(15, 23, 42, 0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-right: 1px solid rgba(255, 255, 255, 0.08);
  }

  .glass-input {
    background: rgba(15, 23, 42, 0.65);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: #f8fafc;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .glass-input:focus {
    background: rgba(15, 23, 42, 0.85);
    border-color: #6366f1;
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    outline: none;
  }

  .glass-table {
    border-collapse: separate;
    border-spacing: 0;
    width: 100%;
  }

  .glass-table th {
    background: rgba(15, 23, 42, 0.85);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    color: #94a3b8;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .glass-table td {
    background: rgba(30, 41, 59, 0.35);
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    color: #e2e8f0;
    transition: background 0.15s ease;
  }

  .glass-table tr:hover td {
    background: rgba(99, 102, 241, 0.08);
  }

  /* Micro-animations & Interactive Effects */
  .hover-lift {
    transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .hover-lift:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 24px -8px rgba(99, 102, 241, 0.25);
  }

  .transition-fade {
    transition: opacity 0.22s cubic-bezier(0.4, 0, 0.2, 1), transform 0.22s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .hidden-fade {
    opacity: 0;
    transform: translateY(10px);
    pointer-events: none;
    height: 0;
    overflow: hidden;
  }

  .visible-fade {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
    height: auto;
  }

  .animate-fade-in {
    animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(6px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* Status Badges System */
  .badge-new {
    background: rgba(59, 130, 246, 0.15);
    color: #60a5fa;
    border: 1px solid rgba(59, 130, 246, 0.35);
  }

  .badge-suitable, .badge-interviewed {
    background: rgba(16, 185, 129, 0.15);
    color: #34d399;
    border: 1px solid rgba(16, 185, 129, 0.35);
  }

  .badge-unsuitable {
    background: rgba(239, 68, 68, 0.15);
    color: #f87171;
    border: 1px solid rgba(239, 68, 68, 0.35);
  }

  .badge-passed {
    background: rgba(168, 85, 247, 0.15);
    color: #c084fc;
    border: 1px solid rgba(168, 85, 247, 0.35);
  }

  .badge-pending {
    background: rgba(245, 158, 11, 0.15);
    color: #fbbf24;
    border: 1px solid rgba(245, 158, 11, 0.35);
  }

  .badge-cancelled {
    background: rgba(100, 116, 139, 0.15);
    color: #94a3b8;
    border: 1px solid rgba(100, 116, 139, 0.35);
  }

  /* Active Navbar Navigation tab style */
  .nav-active-tab {
    color: #6366f1 !important;
    border-bottom: 2px solid #6366f1 !important;
    border-radius: 0px !important;
    background: transparent !important;
  }

  /* --- Complete Light Mode Parity & Element Synchronization --- */
  html:not(.dark) {
    background-color: #f8fafc !important; /* slate-50 */
    color: #0f172a !important; /* slate-900 */
  }

  html:not(.dark) body {
    background-color: #f8fafc !important;
    color: #0f172a !important;
  }

  html:not(.dark) .glass-card {
    background: rgba(255, 255, 255, 0.95) !important;
    border: 1px solid rgba(226, 232, 240, 0.9) !important; /* slate-200 */
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02) !important;
    color: #0f172a !important;
  }

  html:not(.dark) .glass-sidebar,
  html:not(.dark) nav#sidebarPanel {
    background: rgba(255, 255, 255, 0.96) !important;
    border-right: 1px solid rgba(226, 232, 240, 0.9) !important;
    border-bottom: 1px solid rgba(226, 232, 240, 0.9) !important;
    color: #0f172a !important;
  }

  html:not(.dark) .glass-input,
  html:not(.dark) input[type="text"],
  html:not(.dark) input[type="number"],
  html:not(.dark) input[type="email"],
  html:not(.dark) input[type="date"],
  html:not(.dark) input[type="datetime-local"],
  html:not(.dark) input[type="password"],
  html:not(.dark) select,
  html:not(.dark) textarea {
    background: #ffffff !important;
    border: 1px solid rgba(203, 213, 225, 0.9) !important; /* slate-300 */
    color: #0f172a !important;
  }

  html:not(.dark) select option {
    background: #ffffff !important;
    color: #0f172a !important;
  }

  html:not(.dark) .glass-input:focus,
  html:not(.dark) input:focus,
  html:not(.dark) select:focus,
  html:not(.dark) textarea:focus {
    background: #ffffff !important;
    border-color: #4f46e5 !important;
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15) !important;
  }

  html:not(.dark) .glass-table th {
    background: rgba(241, 245, 249, 0.95) !important; /* slate-100 */
    border-bottom: 1px solid rgba(226, 232, 240, 1) !important; /* slate-200 */
    color: #475569 !important; /* slate-600 */
  }

  html:not(.dark) .glass-table td {
    background: rgba(255, 255, 255, 0.95) !important;
    border-bottom: 1px solid rgba(241, 245, 249, 0.9) !important;
    color: #1e293b !important;
  }

  html:not(.dark) .glass-table tr:hover td {
    background: rgba(238, 242, 255, 0.8) !important; /* indigo-50 */
  }

  html:not(.dark) .nav-active-tab {
    color: #4f46e5 !important;
    border-bottom: 2px solid #4f46e5 !important;
  }

  /* Global Light Mode Element Text & Background Synchronization */
  html:not(.dark) h1,
  html:not(.dark) h2,
  html:not(.dark) h3,
  html:not(.dark) h4,
  html:not(.dark) h5,
  html:not(.dark) h6 {
    color: #0f172a !important;
  }

  html:not(.dark) .text-white {
    color: #0f172a !important;
  }

  html:not(.dark) .text-slate-100,
  html:not(.dark) .text-slate-200,
  html:not(.dark) .text-slate-300 {
    color: #1e293b !important;
  }

  html:not(.dark) .text-slate-400 {
    color: #64748b !important;
  }

  html:not(.dark) .bg-slate-900,
  html:not(.dark) .bg-slate-950,
  html:not(.dark) .bg-slate-900\/90,
  html:not(.dark) .bg-slate-900\/95,
  html:not(.dark) .bg-slate-900\/80,
  html:not(.dark) .bg-slate-900\/50 {
    background-color: #ffffff !important;
    color: #0f172a !important;
  }

  html:not(.dark) .bg-slate-800,
  html:not(.dark) .bg-slate-800\/80,
  html:not(.dark) .bg-slate-800\/50 {
    background-color: #f1f5f9 !important;
    color: #1e293b !important;
  }

  html:not(.dark) .border-slate-800,
  html:not(.dark) .border-slate-800\/80,
  html:not(.dark) .border-slate-800\/50,
  html:not(.dark) .border-slate-700,
  html:not(.dark) .border-slate-700\/80 {
    border-color: #e2e8f0 !important;
  }

  /* Preserve White Text Color for Primary Buttons & Accent Badges in Light Mode */
  html:not(.dark) .bg-indigo-600,
  html:not(.dark) .bg-indigo-600 *,
  html:not(.dark) .bg-indigo-500,
  html:not(.dark) .bg-indigo-500 *,
  html:not(.dark) .bg-emerald-600,
  html:not(.dark) .bg-emerald-600 *,
  html:not(.dark) .bg-rose-600,
  html:not(.dark) .bg-rose-600 *,
  html:not(.dark) .bg-amber-600,
  html:not(.dark) .bg-amber-600 *,
  html:not(.dark) button.bg-indigo-600,
  html:not(.dark) button.bg-indigo-600 span {
    color: #ffffff !important;
  }

  /* Light Mode Badge Overrides for Maximum Readability */
  html:not(.dark) .badge-new {
    background: rgba(219, 234, 254, 0.8) !important;
    color: #1d4ed8 !important;
    border-color: rgba(147, 197, 253, 0.8) !important;
  }

  html:not(.dark) .badge-suitable, html:not(.dark) .badge-interviewed {
    background: rgba(209, 250, 229, 0.8) !important;
    color: #047857 !important;
    border-color: rgba(110, 231, 183, 0.8) !important;
  }

  html:not(.dark) .badge-unsuitable {
    background: rgba(254, 226, 226, 0.8) !important;
    color: #b91c1c !important;
    border-color: rgba(252, 165, 165, 0.8) !important;
  }

  html:not(.dark) .badge-passed {
    background: rgba(243, 232, 255, 0.8) !important;
    color: #7e22ce !important;
    border-color: rgba(216, 180, 254, 0.8) !important;
  }

  html:not(.dark) .badge-pending {
    background: rgba(254, 243, 199, 0.8) !important;
    color: #b45309 !important;
    border-color: rgba(252, 211, 77, 0.8) !important;
  }

  /* --- Quill Editor Professional Styling Overrides --- */
  .ql-toolbar.ql-snow {
    border: 1px solid rgba(255, 255, 255, 0.12) !important;
    border-top-left-radius: 0.75rem !important;
    border-top-right-radius: 0.75rem !important;
    background: rgba(15, 23, 42, 0.5) !important;
    padding: 8px 14px !important;
  }

  .ql-container.ql-snow {
    border: 1px solid rgba(255, 255, 255, 0.12) !important;
    border-bottom-left-radius: 0.75rem !important;
    border-bottom-right-radius: 0.75rem !important;
    background: rgba(15, 23, 42, 0.7) !important;
    font-family: var(--font-sans) !important;
    font-size: 0.875rem !important;
  }

  .ql-editor {
    min-height: 140px;
    color: #f8fafc !important;
    padding: 12px 16px !important;
  }

  html:not(.dark) .ql-toolbar.ql-snow {
    border: 1px solid rgba(203, 213, 225, 0.9) !important;
    background: rgba(241, 245, 249, 0.9) !important;
  }

  html:not(.dark) .ql-container.ql-snow {
    border: 1px solid rgba(203, 213, 225, 0.9) !important;
    background: rgba(255, 255, 255, 0.95) !important;
  }

  html:not(.dark) .ql-editor {
    color: #0f172a !important;
  }

  /* SweetAlert2 Theme Customization */
  .swal2-popup {
    border-radius: 1rem !important;
    font-family: var(--font-sans) !important;
  }

  .dark .swal2-popup {
    background: #0f172a !important;
    color: #f8fafc !important;
    border: 1px solid rgba(255, 255, 255, 0.1) !important;
  }

  html:not(.dark) .swal2-popup {
    background: #ffffff !important;
    color: #0f172a !important;
    border: 1px solid rgba(226, 232, 240, 1) !important;
  }

  /* --- Mobile UI/UX Pro Max Optimization System --- */
  @media (max-width: 768px) {
    /* Prevent iOS Safari automatic zoom on form input focus */
    input[type="text"],
    input[type="number"],
    input[type="email"],
    input[type="date"],
    input[type="datetime-local"],
    input[type="password"],
    select,
    textarea {
      font-size: 16px !important;
    }

    /* Standard Apple & Android minimum touch target height (44px) */
    button,
    select,
    input[type="submit"],
    input[type="button"],
    .touch-target {
      min-height: 44px;
    }

    /* Hide scrollbars for smooth horizontal navigation sliders */
    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-none {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Responsive Modal Scaling & Touch Insets for Mobile Devices */
    .modal-content,
    div[id*="modal"] > div {
      width: 94vw !important;
      max-height: 88vh !important;
      padding: 1.25rem !important;
      border-radius: 1.25rem !important;
    }

    /* Mobile Glass Card Padding & Border Radius Adjustments */
    .glass-card {
      padding: 1.25rem !important;
      border-radius: 1.25rem !important;
    }

    /* Smooth Touch Drag for Overflowing Tables */
    .overflow-x-auto {
      -webkit-overflow-scrolling: touch;
    }
  }
</style>
