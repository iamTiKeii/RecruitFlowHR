  <script>
    // Bootstrapping auth & language
    window.addEventListener('DOMContentLoaded', () => {
      checkAuth();
    });

    /**
     * Check auth state from localStorage and toggle sections
     */
    function checkAuth() {
      const userStr = localStorage.getItem('recruitment_user');
      const loginScreen = document.getElementById('loginScreen');
      const sidebarPanel = document.getElementById('sidebarPanel');
      const mainContentPanel = document.getElementById('mainContentPanel');
      
      if (userStr) {
        const user = JSON.parse(userStr);
        
        // Sync role state with Alpine
        if (window.Alpine) {
          const app = document.body && Alpine.$data(document.body);
          if (app) {
            app.isLoggedIn = true;
            app.role = user.role;
            app.fullName = user.fullName;
            app.email = user.email || user.username;
          }
        }
        
        loginScreen.classList.add('hidden');
        sidebarPanel.classList.remove('hidden');
        mainContentPanel.classList.remove('hidden');
        
        const savedLang = localStorage.getItem('recruitment_lang') || 'vi';
        setLanguage(savedLang);
        
        if (typeof initQuillEditors === 'function') {
          initQuillEditors();
        }
        if (typeof syncThemeSwitcherIcons === 'function') {
          syncThemeSwitcherIcons();
        }
        
        // Skip calling initSystem on every refresh if we already initialized
        const isInit = sessionStorage.getItem('isInitialized') === 'true';
        revealApp(isInit);
      } else {
        loginScreen.classList.remove('hidden');
        sidebarPanel.classList.add('hidden');
        mainContentPanel.classList.add('hidden');
        
        const defaultLang = localStorage.getItem('recruitment_lang') || 'vi';
        setLanguage(defaultLang);
      }
    }

    /**
     * Submit login inputs to backend using authenticate
     */
    function handleLogin() {
      const user = document.getElementById('login-username').value.trim();
      const pass = document.getElementById('login-password').value;
      const btn = document.getElementById('login-btn');
      const currentLang = localStorage.getItem('recruitment_lang') || 'vi';

      if (!user || !pass) {
        showLoginAlert(currentLang === 'vi' ? 'Vui lòng điền đầy đủ thông tin.' : 'Please fill all fields.', 'warning');
        return;
      }

      // Disable button and show spinner
      btn.disabled = true;
      btn.innerHTML = `
        <div class="flex items-center justify-center gap-2">
          <div class="animate-spin rounded-full h-4 w-4 border-2 border-white border-t-transparent"></div>
          <span>${currentLang === 'vi' ? 'Đang xác thực...' : 'Authenticating...'}</span>
        </div>
      `;
      hideLoginAlert();

      runBackend('authenticate', user, pass)
        .then(result => {
          if (result.success) {
            // Apply green success transition
            btn.classList.remove('bg-indigo-600', 'hover:bg-indigo-500');
            btn.classList.add('bg-emerald-600');
            btn.innerHTML = `
              <div class="flex items-center justify-center gap-2">
                <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
                <span>${currentLang === 'vi' ? 'Đăng nhập thành công!' : 'Logged in successfully!'}</span>
              </div>
            `;
            
            showLoginAlert(currentLang === 'vi' ? 'Đang kết nối cơ sở dữ liệu...' : 'Connecting to database...', 'success');
            
            // Save user to localStorage
            localStorage.setItem('recruitment_user', JSON.stringify(result.user));
            
            // Get system initialization state
            runBackend('login', user, pass).then(loginRes => {
              sessionStorage.setItem('isInitialized', loginRes.isInitialized ? 'true' : 'false');
              
              // Delayed reveal
              setTimeout(() => {
                btn.disabled = false;
                btn.classList.remove('bg-emerald-600');
                btn.classList.add('bg-indigo-600');
                btn.innerHTML = currentLang === 'vi' ? 'Đăng nhập / Log In' : 'Log In';
                hideLoginAlert();
                checkAuth();
              }, 800);
            }).catch(() => {
              // Fallback if system initialized status check fails
              setTimeout(() => {
                btn.disabled = false;
                btn.classList.remove('bg-emerald-600');
                btn.classList.add('bg-indigo-600');
                btn.innerHTML = currentLang === 'vi' ? 'Đăng nhập / Log In' : 'Log In';
                hideLoginAlert();
                checkAuth();
              }, 800);
            });
          } else {
            btn.disabled = false;
            btn.innerHTML = currentLang === 'vi' ? 'Đăng nhập / Log In' : 'Log In';
            showLoginAlert(result.message, 'error');
          }
        })
        .catch(err => {
          btn.disabled = false;
          btn.innerHTML = currentLang === 'vi' ? 'Đăng nhập / Log In' : 'Log In';
          showLoginAlert(currentLang === 'vi' ? 'Lỗi kết nối: ' + err.message : 'Connection error: ' + err.message, 'error');
        });
    }

    function showLoginAlert(msg, type) {
      const alertEl = document.getElementById('login-alert');
      alertEl.textContent = msg;
      alertEl.className = 'text-xs py-2.5 px-3 rounded-xl border text-center transition-all duration-300 transform scale-95 opacity-0 block';
      
      if (type === 'success') {
        alertEl.classList.add('bg-emerald-950/60', 'border-emerald-500/40', 'text-emerald-300');
      } else if (type === 'error') {
        alertEl.classList.add('bg-rose-950/60', 'border-rose-500/40', 'text-rose-300');
      } else {
        alertEl.classList.add('bg-amber-950/60', 'border-amber-500/40', 'text-amber-300');
      }
      
      setTimeout(() => {
        alertEl.classList.remove('scale-95', 'opacity-0');
        alertEl.classList.add('scale-100', 'opacity-100');
      }, 10);
    }

    function hideLoginAlert() {
      const alertEl = document.getElementById('login-alert');
      alertEl.className = 'hidden';
    }

    /**
     * Destroy active session and reload
     */
    function handleLogout() {
      if (confirm('Bạn có muốn đăng xuất? / Do you want to log out?')) {
        // 1. Clear all user session and authentication caches
        localStorage.removeItem('recruitment_user');
        localStorage.removeItem('recruitment_user_role');
        localStorage.removeItem('recruitment_user_email');
        sessionStorage.clear();
        
        // 2. Reset Alpine App state
        if (window.Alpine && document.body) {
          try {
            const app = Alpine.$data(document.body);
            if (app) {
              app.isLoggedIn = false;
              app.user = null;
              app.role = '';
              app.activeTab = 'login';
              if (typeof app.logout === 'function') app.logout();
            }
          } catch(e) {}
        }
        
        // 3. Reset auth state & force reload
        checkAuth();
        window.location.reload();
      }
    }

    /**
     * Authenticated UI entry point
     */
    function revealApp(isInitialized) {
      const savedLang = localStorage.getItem('recruitment_lang') || 'vi';
      setLanguage(savedLang);
      
      // Load configurations globally
      try {
        loadSystemConfigs();
      } catch (e) {
        console.error("Failed to bootstrap configs:", e);
      }

      const userStr = localStorage.getItem('recruitment_user');
      if (!userStr) return;
      const user = JSON.parse(userStr);

      if (isInitialized) {
        if (user.role === 'Interviewer') {
          navigateTo('interviewer-dashboard');
        } else if (user.role === 'Employee' || user.role === 'Manager') {
          navigateTo('employee-manager');
        } else {
          navigateTo('dashboard');
        }
      } else {
        showLoading(savedLang === 'vi' ? 'Kiểm tra kết nối hệ thống...' : 'Checking connection...');
        runBackend('initSystem')
          .then(result => {
            hideLoading();
            sessionStorage.setItem('isInitialized', 'true');
            if (user.role === 'Interviewer') {
              navigateTo('interviewer-dashboard');
            } else if (user.role === 'Employee' || user.role === 'Manager') {
              navigateTo('employee-manager');
            } else {
              navigateTo('dashboard');
            }
          })
          .catch(err => {
            hideLoading();
            showToast('Lỗi khởi tạo hệ thống: ' + err.message, 'error');
            navigateTo('settings');
          });
      }
    }
  </script>
