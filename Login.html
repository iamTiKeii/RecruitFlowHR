<!-- App-Level Security Login Card -->
<div id="loginScreen" class="fixed inset-0 bg-slate-950/95 dark:bg-slate-950/95 backdrop-blur-md z-50 flex items-center justify-center p-4 transition-all duration-300">
  
  <!-- Subtle ambient glow background behind card -->
  <div class="absolute w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl -z-10 pointer-events-none animate-pulse"></div>

  <div class="glass-card max-w-md w-full p-8 md:p-10 rounded-3xl shadow-2xl space-y-6 border border-slate-800/80 text-center relative overflow-hidden">
    
    <!-- Header Logo & Branding -->
    <div class="flex flex-col items-center gap-3">
      <div class="relative">
        <div class="absolute -inset-1 rounded-2xl bg-gradient-to-r from-indigo-500 via-purple-500 to-emerald-500 opacity-70 blur transition duration-500 group-hover:opacity-100"></div>
        <div class="relative bg-slate-900 p-4 rounded-2xl shadow-xl border border-slate-800">
          <svg class="w-8 h-8 text-indigo-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 2 7 12 12 22 7 12 2" />
            <polyline points="2 17 12 22 22 17" />
            <polyline points="2 12 12 17 22 12" />
          </svg>
        </div>
      </div>

      <div class="space-y-1">
        <h2 class="text-2xl font-extrabold tracking-tight text-white">RecruitFlow <span class="text-indigo-400 font-semibold text-sm">HRM</span></h2>
        <p class="text-xs text-slate-400 font-medium">Hệ thống Quản lý Tuyển dụng & Nhân sự Tự động</p>
      </div>
    </div>

    <!-- Login Form Fields -->
    <div class="space-y-4 text-left">
      <div>
        <label for="login-username" class="block text-[11px] font-bold text-slate-300 dark:text-slate-300 uppercase tracking-wider mb-2">
          Tên đăng nhập / Username
        </label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"></path>
            </svg>
          </div>
          <input type="text" id="login-username" value="admin" placeholder="Nhập tên đăng nhập..." class="w-full pl-10 pr-4 py-3 rounded-xl glass-input text-xs font-medium focus:ring-2 focus:ring-indigo-500/30">
        </div>
      </div>

      <div>
        <label for="login-password" class="block text-[11px] font-bold text-slate-300 dark:text-slate-300 uppercase tracking-wider mb-2">
          Mật khẩu / Password
        </label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"></path>
            </svg>
          </div>
          <input type="password" id="login-password" placeholder="••••••••" class="w-full pl-10 pr-4 py-3 rounded-xl glass-input text-xs font-medium focus:ring-2 focus:ring-indigo-500/30">
        </div>
      </div>
    </div>

    <!-- Inline Alert Feedback -->
    <div id="login-alert" class="hidden text-xs py-3 px-4 rounded-xl border text-center transition-all duration-300 transform scale-95 opacity-0"></div>

    <!-- Submit Button -->
    <button id="login-btn" onclick="handleLogin()" class="w-full py-3.5 px-6 rounded-xl text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-500 active:scale-[0.99] shadow-lg shadow-indigo-600/30 transition-all duration-200 cursor-pointer flex items-center justify-center gap-2">
      <span>Đăng nhập / Log In</span>
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"></path>
      </svg>
    </button>
    
    <div class="pt-2 text-[11px] text-slate-500">
      Được bảo mật bởi hệ thống Google Apps Script RPC Engine
    </div>

  </div>
</div>
